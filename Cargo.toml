[package]
name = "espresso"
version = "0.2.1"
edition = "2024"
description = "Keep your Mac awake from the command line; closing the lid only turns off the screen."
license = "MIT"
repository = "https://github.com/Hanyang-Li/espresso"
readme = "README.md"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["clock"] }
crossterm = "0.29"
clap = { version = "4", features = ["derive"] }
core-foundation = "0.10"
core-foundation-sys = "0.8"
libc = "0.2"
